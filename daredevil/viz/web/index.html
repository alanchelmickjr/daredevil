<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Daredevil — seeing with sound</title>
<style>
:root{
  --bg:#15110c; --panel:#1d1812; --brass:#c08a3e; --brass-lite:#e6b566;
  --ink:#e8dcc2; --dim:#6b5d47; --grn:#5ef0a0; --red:#ff5a6e;
  --sd:#0a0805; --sl:#2a2218;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  background:radial-gradient(circle at 50% 42%, #241c12 0%, #15110c 60%, #0c0a07 100%);}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:14px 22px;z-index:30}
.title{font-size:20px;letter-spacing:3px;color:var(--brass-lite);text-shadow:0 1px 0 #000}
.title small{display:block;font-size:10px;color:var(--dim);letter-spacing:4px;margin-top:2px}
.chips{display:flex;gap:12px;align-items:center}
.chip{background:var(--panel);border:1px solid #3a2f1f;border-radius:20px;padding:7px 14px;
  font-size:12px;color:var(--brass-lite);
  box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.stage{position:relative;width:100vw;height:100vh}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #3a2f1f;
  border-radius:50%;box-shadow:inset 0 0 50px rgba(0,0,0,.55)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:152px;height:152px;
  border-radius:50%;cursor:pointer;z-index:20;border:2px solid #6e4a1f;
  background:radial-gradient(circle at 38% 30%, #e0ad5d, #9c6a2c 58%, #5c3d18);
  box-shadow:9px 9px 20px var(--sd), -7px -7px 16px var(--sl), inset 0 0 20px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#2a1c0a;text-align:center;transition:transform .1s}
.core:active{transform:translate(-50%,-50%) scale(.96)}
.core b{font-size:18px;letter-spacing:2px}
.core span{font-size:10px;color:#3a2810;letter-spacing:1px;margin-top:2px}
.core::after{content:"";position:absolute;width:176px;height:176px;border-radius:50%;
  border:1px solid var(--brass);opacity:.4;animation:pulse 2.6s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.3);opacity:0}}
svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.card{position:absolute;width:188px;max-width:188px;transform:translate(-50%,-50%);z-index:10;padding:10px 12px;
  border-radius:14px;border:1px solid #3a2f1f;cursor:pointer;
  background:linear-gradient(145deg,#221b13,#191309);
  box-shadow:6px 6px 14px var(--sd), -5px -5px 12px var(--sl);
  transition:opacity .8s ease, left .6s ease, top .6s ease, transform .6s ease}
.card.ambient{opacity:.42;filter:saturate(.35)}
.card.stale{opacity:.18;filter:saturate(.2) brightness(.6);transform:translate(-50%,-50%) scale(.85)}
.card.surface{border-color:var(--brass)}
.card.safety{border-color:var(--red);box-shadow:0 0 20px rgba(255,90,110,.45),6px 6px 14px var(--sd)}
.sidebar{position:fixed;top:60px;right:16px;width:180px;bottom:40px;z-index:12;
  display:flex;flex-direction:column-reverse;gap:8px;overflow:hidden}
.known{position:fixed;top:60px;left:16px;width:180px;bottom:40px;z-index:12;
  display:flex;flex-direction:column;gap:8px;overflow:hidden}
.known .card{position:relative;transform:none;width:100%;border-color:var(--brass-lite);opacity:1}
.card .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--brass-lite);overflow:hidden}
.card .who{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.card.safety .who{color:var(--red)}
.card canvas{width:100%;height:34px;display:block;margin:7px 0 3px}
.card .ft{font-size:11px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .bar{height:5px;border-radius:3px;background:#0c0a07;margin-top:6px;overflow:hidden;
  box-shadow:inset 1px 1px 2px #000}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-lite))}
.card .gate{font-size:10px;margin-top:5px;letter-spacing:1px}
.card.surface .gate{color:var(--grn)}
.card.ambient .gate{color:var(--dim)}
.bubble{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:none;
  background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:11px 18px;
  max-width:62%;font-size:13px;color:var(--ink);box-shadow:6px 6px 16px var(--sd)}
.caption{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:35;
  max-width:70%;padding:10px 20px;border-radius:10px;font-size:14px;color:var(--ink);
  background:rgba(29,24,18,.92);border:1px solid var(--brass);
  box-shadow:6px 6px 14px var(--sd);display:none;text-align:center}
.caption.active{display:block}
.caption .src{font-size:11px;color:var(--brass-lite);letter-spacing:1px;margin-bottom:4px}
.legend{position:fixed;bottom:12px;left:18px;font-size:11px;color:var(--dim);z-index:30}
/* --- Calibration overlay --- */
.cal-overlay{position:fixed;inset:0;z-index:100;display:none;
  background:rgba(10,8,5,.88);backdrop-filter:blur(4px);
  align-items:center;justify-content:center}
.cal-overlay.active{display:flex}
.cal-panel{width:420px;max-width:90vw;padding:28px 32px;border-radius:18px;
  border:1px solid var(--brass);
  background:linear-gradient(160deg,#1d1812,#151008);
  box-shadow:12px 12px 30px var(--sd), -8px -8px 20px var(--sl), inset 0 0 40px rgba(0,0,0,.3)}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cal-title{font-size:16px;letter-spacing:4px;color:var(--brass-lite)}
.cal-close{font-size:24px;color:var(--dim);cursor:pointer}
.cal-phases{display:flex;gap:18px;margin-bottom:18px}
.cal-phase{font-size:11px;letter-spacing:2px;color:var(--dim);display:flex;align-items:center;gap:6px}
.cal-phase.active{color:var(--brass-lite)}
.cal-phase.done{color:var(--grn)}
.cal-dot{width:8px;height:8px;border-radius:50%;border:1px solid currentColor;display:inline-block}
.cal-phase.active .cal-dot{background:var(--brass-lite)}
.cal-phase.done .cal-dot{background:var(--grn)}
.cal-countdown{font-size:72px;text-align:center;color:var(--brass-lite);
  font-family:Georgia,serif;min-height:90px;line-height:90px;
  text-shadow:0 2px 8px rgba(192,138,62,.4)}
.cal-prompt{font-size:14px;color:var(--ink);text-align:center;margin:12px 0;min-height:40px}
.cal-meter{height:10px;border-radius:5px;background:#0c0a07;margin:12px 0;overflow:hidden;
  box-shadow:inset 1px 1px 3px #000}
.cal-meter-fill{height:100%;width:0%;border-radius:5px;transition:width .3s;
  background:linear-gradient(90deg,var(--grn),#5ef0a0cc)}
.cal-progress{height:5px;border-radius:3px;background:#0c0a07;margin:8px 0;overflow:hidden}
.cal-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--brass),var(--brass-lite));transition:width .4s}
.cal-stats{font-size:11px;color:var(--dim);text-align:center;margin:8px 0;min-height:16px}
.cal-result{text-align:center;margin:14px 0;display:none}
.cal-result .dprime{font-size:28px;color:var(--brass-lite);font-weight:bold}
.cal-result .err{font-size:12px;color:var(--dim);margin-top:4px}
.cal-result .quality{font-size:13px;margin-top:6px;letter-spacing:2px}
.cal-result .quality.good{color:var(--grn)}
.cal-result .quality.fair{color:var(--brass-lite)}
.cal-result .quality.poor{color:var(--red)}
.cal-actions{display:flex;justify-content:center;gap:12px;margin-top:18px}
.cal-btn{background:var(--panel);border:1px solid var(--brass);border-radius:20px;
  padding:10px 22px;font-size:13px;color:var(--brass-lite);cursor:pointer;letter-spacing:2px;
  box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl);transition:all .15s}
.cal-btn:hover{background:#2a2218;border-color:var(--brass-lite)}
.cal-btn:active{transform:scale(.96)}
.cal-btn-dim{opacity:.6}
</style>
</head>
<body>
<div class="topbar">
  <div class="title">DAREDEVIL<small>SEEING WITH SOUND</small></div>
  <div class="chips">
    <div class="chip" id="wake">🎙 Hey Radar</div>
    <div class="chip" id="calChip" style="cursor:pointer">⚙ Calibrate</div>
    <div class="chip">on-device · no cloud</div>
  </div>
</div>
<div class="stage" id="stage">
  <svg class="links" id="links"></svg>
  <div class="core" id="core"><b>DAREDEVIL</b><span>tap to talk</span></div>
</div>
<div class="known" id="known"></div>
<div class="sidebar" id="sidebar"></div>
<div class="bubble" id="bubble"></div>
<div class="cal-overlay" id="calOverlay">
  <div class="cal-panel">
    <div class="cal-header">
      <span class="cal-title">CALIBRATION</span>
      <span class="cal-close" id="calClose">&times;</span>
    </div>
    <div class="cal-phases">
      <div class="cal-phase" data-phase="1"><span class="cal-dot"></span> SPEAK</div>
      <div class="cal-phase" data-phase="2"><span class="cal-dot"></span> SHUT UP</div>
      <div class="cal-phase" data-phase="3"><span class="cal-dot"></span> THE WORLD</div>
    </div>
    <div class="cal-countdown" id="calCountdown"></div>
    <div class="cal-prompt" id="calPrompt">Click CALIBRATE to begin.</div>
    <div class="cal-meter"><div class="cal-meter-fill" id="calMeter"></div></div>
    <div class="cal-progress"><div class="cal-progress-fill" id="calProgress"></div></div>
    <div class="cal-stats" id="calStats"></div>
    <div class="cal-result" id="calResult"></div>
    <div class="cal-name" style="margin-bottom:14px;text-align:center">
      <input type="text" id="calName" placeholder="name (e.g. alan, jeff)" value=""
        style="background:var(--panel);border:1px solid var(--brass);border-radius:8px;
        padding:8px 14px;color:var(--ink);font-size:14px;width:200px;text-align:center;
        box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)"/>
    </div>
    <div class="cal-actions">
      <button class="cal-btn" id="calStart">START</button>
      <button class="cal-btn" id="calNext" style="display:none">NEXT PHASE</button>
      <button class="cal-btn" id="calRetry" style="display:none">RE-RUN</button>
      <button class="cal-btn cal-btn-dim" id="calDone" style="display:none">DONE</button>
    </div>
  </div>
</div>
<div class="caption" id="caption"></div>
<div class="legend">green → routed to the LLM · grey dashed → heard, gated out · red → safety override · click a source to focus</div>
<script>
const stage=document.getElementById('stage'),links=document.getElementById('links'),
  core=document.getElementById('core'),bubble=document.getElementById('bubble'),
  wake=document.getElementById('wake'),sidebar=document.getElementById('sidebar'),
  known=document.getElementById('known');
let cards={}, seen={}, activeIds=new Set();
const FREQ={Speech:3,baby_cry:7,alarm:9,siren:8,Music:5,speech:3,music:5};
const POLL_MS=1500, FADE_MS=3000, TOAST_MS=4500, MAX_SIDEBAR=6;
function rings(){const cx=innerWidth/2,cy=innerHeight/2,base=Math.min(cx,cy);
  [0.4,0.7,1.0].forEach(f=>{const d=base*2*f,r=document.createElement('div');
    r.className='ring';r.style.width=d+'px';r.style.height=d+'px';stage.appendChild(r);});}
function pos(az,priority,idx,total){
  const cx=innerWidth/2,cy=innerHeight/2,base=Math.min(cx,cy);
  const R=base*(0.46+0.40*(1-priority)),a=az*Math.PI/180;
  let x=cx+R*Math.sin(a), y=cy-R*Math.cos(a);
  // nudge overlapping cards apart
  if(total>1){const spread=22*idx-(11*(total-1)); y+=spread;}
  return [x,y];}
function waveDraw(cv,freq,col){const ctx=cv.getContext('2d');let t=0;
  function f(){const w=cv.width=cv.clientWidth,h=cv.height=34;ctx.clearRect(0,0,w,h);
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();
    for(let x=0;x<w;x++){const y=h/2+Math.sin(x/w*freq*6.28+t)*Math.sin(x/w*3.14)*h*0.36;
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();t+=0.16;cv._raf=requestAnimationFrame(f);}
  cancelAnimationFrame(cv._raf||0);f();}
function makeCard(s){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="hd"><span class="who"></span><span class="pr"></span></div>'
    +'<canvas></canvas><div class="ft"></div><div class="bar"><i></i></div><div class="gate"></div>';
  c.onclick=()=>setFocus(s.id);
  return c;}
function render(map){
  const now=Date.now(),cx=innerWidth/2,cy=innerHeight/2;links.innerHTML='';
  const currentIds=new Set();
  const sources=map.sources||[];
  // group by azimuth bucket for collision avoidance
  const azBuckets={};
  sources.forEach(s=>{
    const az=Math.round(((s.position&&s.position.azimuth)||0)/15)*15;
    if(!azBuckets[az])azBuckets[az]=[];
    azBuckets[az].push(s);});
  sources.forEach(s=>{
    currentIds.add(s.id);
    seen[s.id]=now;
    const surfaced=s.attention==='surface',safety=s.event&&s.event.safety_critical;
    const enrolled=s.type==='enrolled';
    const coasting=s.track_status==='coasting';
    const col=safety?'#ff5a6e':(surfaced?'#5ef0a0':'#6b5d47');
    let c=cards[s.id];
    if(!c){c=makeCard(s);cards[s.id]=c;}
    // enrolled/known speakers go to the left column
    if(enrolled){
      if(c.parentNode!==known){c.remove();
        c.style.left='';c.style.top='';c.style.position='relative';
        c.style.transform='none';c.style.width='100%';
        known.appendChild(c);}
      c.className='card surface';
      c.style.opacity='';
    } else if(coasting){
      // coasting = lost contact, fade to sidebar
      if(c.parentNode!==sidebar){c.remove();
        c.style.left='';c.style.top='';c.style.position='relative';
        c.style.transform='none';c.style.width='100%';
        c.className='card stale';sidebar.appendChild(c);}
    } else {
      // active unknown sources orbit on the radar
      if(c.parentNode!==stage){c.remove();stage.appendChild(c);}
      const az=Math.round(((s.position&&s.position.azimuth)||0)/15)*15;
      const bucket=azBuckets[az]||[s];
      const idx=bucket.indexOf(s),total=bucket.length;
      c.className='card '+(surfaced?'surface':'ambient')+(safety?' safety':'');
      c.style.opacity='';
      const [x,y]=pos((s.position&&s.position.azimuth)||0,s.priority,idx,total);
      c.style.left=x+'px';c.style.top=y+'px';
    }
    c.querySelector('.who').textContent=(safety?'⚠ ':'')+s.id;
    c.querySelector('.pr').textContent='p='+Number(s.priority).toFixed(2);
    c.querySelector('.ft').textContent=s.event.class+' · '+s.prosody.state;
    // Identity progress bar: show LLR building toward match
    if(s.identifying){
      c.querySelector('.bar i').style.width=Math.round(s.identifying.progress*100)+'%';
      c.querySelector('.bar i').style.background='linear-gradient(90deg,var(--grn),#5ef0a0cc)';
      c.querySelector('.gate').textContent='identifying '+s.identifying.name+'… '+Math.round(s.identifying.progress*100)+'%';
    }else{
      c.querySelector('.bar i').style.width=Math.round(s.priority*100)+'%';
      c.querySelector('.bar i').style.background='';
      c.querySelector('.gate').textContent=surfaced?'→ ROUTED TO LLM':'gated · ambient';
    }
    // Focus highlight
    if(s.id===focusId||map.focus===s.id){c.style.boxShadow='0 0 16px var(--grn), 6px 6px 14px var(--sd)';c.style.borderColor='var(--grn)';}
    else{c.style.boxShadow='';c.style.borderColor='';}
    waveDraw(c.querySelector('canvas'),FREQ[s.event.class]||4,col);
    // draw link line for non-enrolled active sources
    if(!enrolled){
      const [x,y]=pos((s.position&&s.position.azimuth)||0,s.priority,0,1);
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);ln.setAttribute('x2',x);ln.setAttribute('y2',y);
      ln.setAttribute('stroke',col);ln.setAttribute('stroke-width',surfaced?'2':'1');
      ln.setAttribute('opacity',surfaced?'0.6':'0.22');
      if(!surfaced)ln.setAttribute('stroke-dasharray','5 5');
      links.appendChild(ln);}
  });
  // move stale cards to sidebar — known speakers linger 3x longer
  Object.keys(cards).forEach(id=>{
    if(currentIds.has(id))return;
    const c=cards[id];
    const isKnown=c.parentNode===known;
    const age=now-(seen[id]||0);
    if(isKnown){
      if(age>FADE_MS*3){c.remove();delete cards[id];}
      else{c.style.opacity=String(Math.max(0.3,1-(age/(FADE_MS*3))));}
      return;}
    if(c.parentNode!==sidebar){
      c.style.left='';c.style.top='';c.style.position='relative';
      c.style.transform='none';c.style.width='100%';
      c.className='card stale';sidebar.appendChild(c);}
  });
  // enforce max sidebar capacity — oldest out first
  while(sidebar.children.length>MAX_SIDEBAR){
    const oldest=sidebar.firstElementChild;
    const oid=Object.keys(cards).find(k=>cards[k]===oldest);
    if(oldest){oldest.remove();if(oid)delete cards[oid];}else break;}
  // fade proportionally by position in the column (bottom = freshest)
  Array.from(sidebar.children).forEach((c,i,arr)=>{
    c.style.opacity=String(0.15+0.6*(i/Math.max(1,arr.length-1)));});
  activeIds=currentIds;
  if(map.wake_word)wake.textContent='🎙 '+map.wake_word;
  // Captions
  const cap=document.getElementById('caption');
  if(map.transcript&&map.transcript.text){
    cap.innerHTML='<div class="src">'+map.transcript.source+'</div>'+map.transcript.text;
    cap.classList.add('active');
  }else if(!map.focus){cap.classList.remove('active');}
}
function say(html,ms){bubble.style.display='block';bubble.innerHTML=html;
  clearTimeout(bubble._t);bubble._t=setTimeout(()=>bubble.style.display='none',ms||TOAST_MS);}
function probe(id){fetch('/probe?id='+encodeURIComponent(id)).then(r=>r.json())
  .then(d=>say(d.implemented===false ? ('<b>'+d.id+'</b><br>TODO: '+d.todo)
                                     : ('<b>'+d.id+' → LLM</b><br>'+d.transcript))).catch(()=>{});}
let focusId=null;
function setFocus(id){
  if(focusId===id){focusId=null;fetch('/focus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});say('focus cleared');}
  else{focusId=id;fetch('/focus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});say('<b>focused:</b> '+id+'<br>only this source talks to the LLM');}
}
core.onclick=()=>{if(focusId){setFocus(focusId);}else{say('click a source card to focus');}};
function poll(){
  fetch('/awareness',{signal:AbortSignal.timeout(5000)})
    .then(r=>r.json()).then(d=>{render(d);setTimeout(poll,POLL_MS);})
    .catch(()=>{setTimeout(poll,POLL_MS*2);});}
rings();poll();
addEventListener('resize',()=>{document.querySelectorAll('.ring').forEach(r=>r.remove());rings();});

// --- Calibration UX ---
const calOverlay=document.getElementById('calOverlay'),
  calCountdown=document.getElementById('calCountdown'),
  calPrompt=document.getElementById('calPrompt'),
  calMeter=document.getElementById('calMeter'),
  calProgress=document.getElementById('calProgress'),
  calStats=document.getElementById('calStats'),
  calResult=document.getElementById('calResult'),
  calStart=document.getElementById('calStart'),
  calNext=document.getElementById('calNext'),
  calRetry=document.getElementById('calRetry'),
  calDone=document.getElementById('calDone'),
  calClose=document.getElementById('calClose');
let calPolling=false;
const CAL_POLL_MS=300;

function openCal(){
  calOverlay.classList.add('active');
  calResult.style.display='none';
  calStart.style.display='';calNext.style.display='none';
  calRetry.style.display='none';calDone.style.display='none';
  calCountdown.textContent='';calPrompt.textContent='Hit START when ready.';
  calMeter.style.width='0%';calProgress.style.width='0%';calStats.textContent='';
  document.querySelectorAll('.cal-phase').forEach(p=>p.className='cal-phase');
}
function closeCal(){calOverlay.classList.remove('active');calPolling=false;}

document.getElementById('calChip').onclick=openCal;
core.addEventListener('dblclick',openCal);
calClose.onclick=closeCal;
calDone.onclick=closeCal;

calStart.onclick=()=>{
  fetch('/calibrate/start',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('calName').value.trim()||'you',seconds:20,others:true})})
  .then(()=>{
    calStart.style.display='none';calNext.style.display='';
    calPrompt.textContent='Ready. Hit NEXT PHASE when you\'re set to talk.';
    calPolling=true;pollCal();
  });};

calNext.onclick=()=>{
  fetch('/calibrate/phase',{method:'POST'});
  calNext.style.display='none';};

calRetry.onclick=()=>{calRetry.style.display='none';openCal();calStart.click();};

function pollCal(){
  if(!calPolling)return;
  fetch('/calibrate/status',{signal:AbortSignal.timeout(3000)})
    .then(r=>r.json()).then(renderCal).catch(()=>{})
    .finally(()=>{if(calPolling)setTimeout(pollCal,CAL_POLL_MS);});}

function renderCal(s){
  // phase indicators
  document.querySelectorAll('.cal-phase').forEach(p=>{
    const idx=parseInt(p.dataset.phase);
    if(idx<s.phase_index)p.className='cal-phase done';
    else if(idx===s.phase_index)p.className='cal-phase active';
    else p.className='cal-phase';});
  // countdown
  if(s.phase==='countdown'&&s.countdown>0){
    calCountdown.textContent=s.countdown;
  }else if(s.phase==='countdown'&&s.countdown===0){
    calCountdown.textContent='GO';
  }else{calCountdown.textContent='';}
  // prompt
  calPrompt.textContent=s.prompt;
  // level meter
  calMeter.style.width=Math.round(s.level*100)+'%';
  calMeter.style.background=s.level>0.8?'linear-gradient(90deg,var(--red),#ff5a6ecc)':'';
  // progress
  if(s.duration>0&&s.elapsed>0){
    calProgress.style.width=Math.round((s.elapsed/s.duration)*100)+'%';
  }else{calProgress.style.width='0%';}
  // stats
  let st=[];
  if(s.voice_frames)st.push(s.voice_frames+' voice frames');
  if(s.bg_frames)st.push(s.bg_frames+' bg frames');
  calStats.textContent=st.join(' · ');
  // show NEXT when a phase completes
  if(s.phase&&s.phase.endsWith('_done')&&calNext.style.display==='none'){
    calNext.style.display='';}
  // done
  if(s.phase==='done'){
    calPolling=false;calNext.style.display='none';
    calResult.style.display='';
    calResult.innerHTML='<div class="dprime">d′ = '+s.dprime+'</div>'
      +'<div class="err">'+s.error_pct+'</div>'
      +'<div class="quality '+s.quality+'">'+s.quality.toUpperCase()+'</div>';
    if(s.quality==='poor')calRetry.style.display='';
    calDone.style.display='';
  }
}
</script>
</body>
</html>
